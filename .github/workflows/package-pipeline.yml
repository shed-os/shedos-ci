name: package-pipeline

on:
  workflow_call:
    inputs:
      packages:
        description: JSON array of package directories to build, relative to the repo root.
        type: string
        default: '["."]'
      needs_network_build:
        description: >-
          Marks a package whose build reaches the network. The container has
          network either way today; the flag records the intent so builds can
          be tightened later without hunting for which packages need it.
        type: boolean
        default: false
      privileged_tests:
        description: Run the test job in a privileged container (loop devices, mounts).
        type: boolean
        default: false
      ci_ref:
        description: >-
          The shedos-ci ref the pipeline scripts come from. Callers that pin
          this workflow to a tag should pin this to the same one, since no
          context exposes the ref a reusable workflow was called at.
        type: string
        default: main
    secrets:
      SHEDOS_DISPATCH_TOKEN:
        description: Token the publish request authenticates with against shedos-release.
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      # First, before any pacman call: shedos-system's install scriptlet points
      # /etc/pacman.conf at the production repo when it lands as a build
      # dependency, and the next `pacman -Sy` then resolves against packages we
      # are in the middle of replacing. The marker tells the scriptlet to skip;
      # the strip clears any fence an earlier layer left behind.
      - name: Mark the build environment
        run: |
          touch /.shedos-build-environment
          sed -i \
            -e '/^# >>> shedos <<<$/,/^# <<< shedos >>>$/d' \
            -e '/^# >>> shedostest <<<$/,/^# <<< shedostest >>>$/d' \
            -e '/^# >>> shedos-testing <<<$/,/^# <<< shedos-testing >>>$/d' \
            /etc/pacman.conf

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel git sudo jq curl
          # archlinux:latest ships an empty keyring; populate it for --syncdeps.
          pacman-key --init
          pacman-key --populate archlinux
          # makepkg refuses to run as root.
          useradd -m -G wheel builder
          echo '%wheel ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/wheel
          chmod 440 /etc/sudoers.d/wheel

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # A reusable workflow's steps run against the caller's checkout, so the
      # scripts this pipeline calls have to come from a second one.
      - name: Check out the pipeline scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: shed-os/shedos-ci
          ref: ${{ inputs.ci_ref }}
          path: .shedos-ci

      - name: Trust workspace for git
        # Container uid differs from checkout owner; avoids "dubious ownership".
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Hand the tree to the build user
        run: chown -R builder:builder .

      - name: Build packages
        env:
          PACKAGES: ${{ inputs.packages }}
        run: bash .shedos-ci/scripts/build-package.sh "$PACKAGES"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-${{ github.sha }}
          path: dist
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: ${{ inputs.privileged_tests && '--privileged' || '' }}
    steps:
      - name: Install test dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel git sudo jq
          pacman-key --init
          pacman-key --populate archlinux

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Trust workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run test suites
        run: |
          set -uo pipefail
          shopt -s nullglob
          runners=(test/*/run.sh)
          if (( ${#runners[@]} == 0 )); then
              echo "no test suites"
              exit 0
          fi
          pass=0
          fail=0
          failed=()
          for runner in "${runners[@]}"; do
              suite=$(basename "$(dirname "$runner")")
              printf '════════ %s ════════\n' "$suite"
              if bash "$runner"; then
                  pass=$((pass + 1))
              else
                  fail=$((fail + 1))
                  failed+=("$suite")
              fi
              echo
          done
          printf '════════ %d suites passed, %d failed ════════\n' "$pass" "$fail"
          if (( fail > 0 )); then
              printf 'failed: %s\n' "${failed[*]}" >&2
              exit 1
          fi

  publish-request:
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Same image as the other two jobs on purpose. On the bare host this job
    # ran against the runner's jq, which is a major version behind the one the
    # harness tests with, and a jq program that compiled everywhere else was a
    # syntax error here.
    container:
      image: archlinux:latest
    steps:
      - name: Install dispatch dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git github-cli jq

      - name: Check out the pipeline scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: shed-os/shedos-ci
          ref: ${{ inputs.ci_ref }}
          path: .shedos-ci

      - name: Fetch the built packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg-${{ github.sha }}
          # The upload flattens dist/, so put the contents back where
          # request-publish.sh looks for them.
          path: dist

      - name: Ask shedos-release to publish
        env:
          GH_TOKEN: ${{ secrets.SHEDOS_DISPATCH_TOKEN }}
        run: bash .shedos-ci/scripts/request-publish.sh
